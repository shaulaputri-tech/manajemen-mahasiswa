<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Tambah Mahasiswa</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5" style="max-width: 600px;">
    <h2 class="mb-4">Tambah Mahasiswa Baru</h2>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }}">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST">
        <div class="mb-3">
            <label class="form-label">NIM</label>
            <input type="number" class="form-control" name="nim" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Nama</label>
            <input type="text" class="form-control" name="nama" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Program Studi</label>
            <input type="text" class="form-control" name="program_studi" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Angkatan (Tahun)</label>
            <input type="number" class="form-control" name="angkatan" required>
        </div>
        <div class="mb-3">
            <label class="form-label">IPK (0.00 - 4.00)</label>
            <input type="number" step="0.01" class="form-control" name="ipk" required>
        </div>
        <button type="submit" class="btn btn-success">Simpan</button>
        <a href="/" class="btn btn-secondary">Kembali</a>
    </form>
</body>
</html>
